name: Java End-to-End CI

on:
  schedule:
    - cron: '30 18 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/java-project
  MOBILE_NUMBER: 9876543210
  EMAIL_ID: student@example.com

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test with Maven
        working-directory: demo
        run: mvn -B clean verify

      - name: Run validation examples and create HTML report
        if: always()
        working-directory: demo
        run: |
          report_directory="target/ci-reports"
          report_file="$report_directory/execution-report.html"
          mkdir -p "$report_directory"

          cat > "$report_file" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Java Program Execution Report</title>
            <style>
              body { font-family: sans-serif; margin: 2rem; color: #17212b; }
              h1 { color: #075985; }
              table { border-collapse: collapse; width: 100%; max-width: 900px; }
              th, td { border: 1px solid #cbd5e1; padding: 0.75rem; text-align: left; }
              th { background: #e0f2fe; }
              .pass { color: #166534; font-weight: bold; }
              .fail { color: #b91c1c; font-weight: bold; }
            </style>
          </head>
          <body>
            <h1>Java Program Execution Report</h1>
            <p>Workflow: Java End-to-End CI</p>
            <table>
              <thead><tr><th>Program</th><th>Scenario</th><th>Input</th><th>Output</th><th>Result</th></tr></thead>
              <tbody>
          HTML

          failures=0
          run_validation() {
            scenario="$1"
            value="$2"
            expected="$3"
            set +e
            output=$(java -cp target/classes com.regularExpressions.checkNumber "$scenario" "$value")
            exit_code=$?
            set -e

            if [ "$exit_code" -eq 0 ] && [ "$output" = "$expected" ]; then
              result="PASS"
              css_class="pass"
            else
              result="FAIL"
              css_class="fail"
              failures=$((failures + 1))
            fi

            printf '<tr><td>checkNumber</td><td>%s</td><td>%s</td><td>%s</td><td class="%s">%s</td></tr>\n' \
              "$scenario" "$value" "$output" "$css_class" "$result" >> "$report_file"
            echo "checkNumber $scenario: $output ($result)"
          }

          run_validation mobile "$MOBILE_NUMBER" "Valid mobile number"
          run_validation email "$EMAIL_ID" "Valid email address"

          cat >> "$report_file" <<'HTML'
              </tbody>
            </table>
          </body>
          </html>
          HTML

          if [ "$failures" -ne 0 ]; then
            exit 1
          fi

          echo "HTML execution report created: $report_file"

      - name: Upload Java execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-execution-report
          path: demo/target/ci-reports/execution-report.html
          if-no-files-found: warn

      - name: Upload Surefire XML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: demo/target/surefire-reports/*.xml
          if-no-files-found: ignore

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag_sha: ${{ steps.image_tags.outputs.image_tag_sha }}
      image_tag_latest: ${{ steps.image_tags.outputs.image_tag_latest }}
      pushed: ${{ steps.push_flag.outputs.pushed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag outputs
        id: image_tags
        run: |
          echo "image_tag_sha=ghcr.io/${{ github.repository_owner }}/java-project:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_tag_latest=ghcr.io/${{ github.repository_owner }}/java-project:latest" >> "$GITHUB_OUTPUT"

      - name: Set push flag
        id: push_flag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: demo
        run: |
          docker build \
            -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            .

      - name: Push Docker images
        if: github.event_name == 'push'
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

  notify:
    name: Notify via Email
    runs-on: ubuntu-latest
    needs: [build-test, docker]
    if: always()
    steps:
      - name: Check SMTP configuration
        id: smtp_check
        shell: bash
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          if [ -n "${SMTP_SERVER}" ] && [ -n "${SMTP_PORT}" ] && \
             [ -n "${SMTP_USERNAME}" ] && [ -n "${SMTP_PASSWORD}" ] && \
             [ -n "${SMTP_FROM}" ] && [ -n "${SMTP_TO}" ]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "SMTP secrets not fully configured; skipping email step."
          fi

      - name: Send email notification
        if: steps.smtp_check.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Java E2E CI Pipeline — ${{ github.ref_name }} (${{ github.sha }})"
          to: ${{ secrets.SMTP_TO }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            Java End-to-End CI Pipeline Run Summary
            ========================================

            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Commit SHA : ${{ github.sha }}
            Triggered by: ${{ github.event_name }}

            Job Results
            -----------
            build-test : ${{ needs.build-test.result }}
            docker     : ${{ needs.docker.result }}

            Docker Image Details
            --------------------
            Image name : ghcr.io/${{ github.repository_owner }}/java-project
            SHA tag    : ghcr.io/${{ github.repository_owner }}/java-project:${{ github.sha }}
            Latest tag : ghcr.io/${{ github.repository_owner }}/java-project:latest
            Pushed     : ${{ needs.docker.outputs.pushed }}

            Note: Images are pushed to GHCR only on push events (not on pull requests).

            View workflow run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
