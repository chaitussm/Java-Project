name: Java End-to-End CI

on:
  schedule:
    - cron: '30 18 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/java-project
  MOBILE_NUMBER: 9876543210
  EMAIL_ID: student@example.com

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test with Maven
        working-directory: demo
        run: mvn -B clean verify

      - name: Execute Java programs and create HTML report
        if: always()
        working-directory: demo
        run: |
          report_directory="target/ci-reports"
          report_file="$report_directory/execution-report.html"
          output_file="$report_directory/program-output.txt"
          source_root="src/main/java"
          main_pattern='public[[:space:]]+static[[:space:]]+void[[:space:]]+main[[:space:]]*\('
          mkdir -p "$report_directory"
          SECONDS=0

          cat > "$report_file" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Java Program Execution Report</title>
            <style>
              body { font-family: sans-serif; margin: 2rem; color: #17212b; }
              h1 { color: #075985; }
              table { border-collapse: collapse; width: 100%; max-width: 900px; }
              th, td { border: 1px solid #cbd5e1; padding: 0.75rem; text-align: left; }
              th { background: #e0f2fe; }
              .pass { color: #166534; font-weight: bold; }
              .fail { color: #b91c1c; font-weight: bold; }
            </style>
          </head>
          <body>
            <h1>Java Program Execution Report</h1>
            <p>Workflow: Java End-to-End CI</p>
            <table>
              <thead><tr><th>Folder</th><th>Program</th><th>Arguments</th><th>Output</th><th>Exit Code</th><th>Status</th></tr></thead>
              <tbody>
          HTML

          program_count=0
          passed_count=0
          failed_count=0
          timed_out_count=0

          html_escape() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }

          run_program() {
            folder="$1"
            program="$2"
            arguments="$3"
            set +e
            timeout --kill-after=2s 5s java -cp target/classes "$program" $arguments > "$output_file" 2>&1
            exit_code=$?
            set -e
            output=$(head -c 20000 "$output_file")

            if [ "$exit_code" -eq 0 ]; then
              status="PASSED"
              css_class="pass"
              passed_count=$((passed_count + 1))
            elif [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ]; then
              status="TIMED OUT"
              css_class="fail"
              timed_out_count=$((timed_out_count + 1))
            else
              status="FAILED"
              css_class="fail"
              failed_count=$((failed_count + 1))
            fi

            printf '<tr><td>%s</td><td>%s</td><td>%s</td><td><pre>%s</pre></td><td>%s</td><td class="%s">%s</td></tr>\n' \
              "$(html_escape "$folder")" "$(html_escape "$program")" "$(html_escape "$arguments")" \
              "$(html_escape "$output")" "$exit_code" "$css_class" "$status" >> "$report_file"
            echo "[$status] $folder > $program (exit code: $exit_code)"
            printf '%s\n' "$output"
            program_count=$((program_count + 1))
          }

          run_program "regularExpressions" "com.regularExpressions.checkNumber" "mobile $MOBILE_NUMBER"
          run_program "regularExpressions" "com.regularExpressions.checkNumber" "email $EMAIL_ID"

          while IFS= read -r -d '' source_file; do
            [ "$source_file" = "$source_root/com/regularExpressions/checkNumber.java" ] && continue
            grep -q -E "$main_pattern" "$source_file" || continue
            class_name=${source_file#"$source_root"/}
            class_name=${class_name%.java}
            class_name=${class_name//\//.}
            relative_path=${source_file#"$source_root"/com/}
            folder=${relative_path%%/*}
            run_program "$folder" "$class_name" ""
          done < <(find "$source_root" -name '*.java' -print0 | sort -z)

          total_duration_seconds=$SECONDS
          printf '    <p><strong>Execution summary:</strong> %s programs scanned in %s seconds. Passed: %s. Failed: %s. Timed out: %s.</p>\n' \
            "$program_count" "$total_duration_seconds" "$passed_count" "$failed_count" "$timed_out_count" >> "$report_file"

          cat >> "$report_file" <<'HTML'
              </tbody>
            </table>
          </body>
          </html>
          HTML

          echo "Executed $program_count programs in $total_duration_seconds seconds: $passed_count passed, $failed_count failed, $timed_out_count timed out."
          echo "HTML execution report created: $report_file"

      - name: Upload Java execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-execution-report
          path: demo/target/ci-reports/execution-report.html
          if-no-files-found: warn

      - name: Upload Surefire XML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: demo/target/surefire-reports/*.xml
          if-no-files-found: ignore

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag_sha: ${{ steps.image_tags.outputs.image_tag_sha }}
      image_tag_latest: ${{ steps.image_tags.outputs.image_tag_latest }}
      pushed: ${{ steps.push_flag.outputs.pushed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag outputs
        id: image_tags
        run: |
          echo "image_tag_sha=ghcr.io/${{ github.repository_owner }}/java-project:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_tag_latest=ghcr.io/${{ github.repository_owner }}/java-project:latest" >> "$GITHUB_OUTPUT"

      - name: Set push flag
        id: push_flag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: demo
        run: |
          docker build \
            -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            .

      - name: Push Docker images
        if: github.event_name == 'push'
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

  notify:
    name: Notify via Email
    runs-on: ubuntu-latest
    needs: [build-test, docker]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Java execution report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: java-execution-report
          path: ci-report

      - name: Count Java programs
        id: program_counts
        shell: bash
        run: |
          source_root="demo/src/main/java/com"
          main_pattern='public[[:space:]]+static[[:space:]]+void[[:space:]]+main[[:space:]]*\('

          # grep exits 1 when there are no matches. Actions runs bash with
          # -o pipefail, so that would fail the step for empty folders.
          count_mains() {
            grep -R -E -h --include='*.java' "$main_pattern" "$1" 2>/dev/null | wc -l | tr -d ' ' || true
          }

          total_programs=$(count_mains "$source_root")
          folder_counts=""

          for folder in "$source_root"/*; do
            [ -d "$folder" ] || continue
            folder_name=$(basename "$folder")
            program_count=$(count_mains "$folder")
            folder_counts="${folder_counts}${folder_name}: ${program_count}; "
          done

          echo "total_programs=$total_programs" >> "$GITHUB_OUTPUT"
          echo "folder_counts=$folder_counts" >> "$GITHUB_OUTPUT"

      - name: Check SMTP configuration
        id: smtp_check
        shell: bash
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          if [ -n "${SMTP_SERVER}" ] && [ -n "${SMTP_PORT}" ] && \
             [ -n "${SMTP_USERNAME}" ] && [ -n "${SMTP_PASSWORD}" ] && \
             [ -n "${SMTP_FROM}" ] && [ -n "${SMTP_TO}" ]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "SMTP secrets not fully configured; skipping email step."
          fi

      - name: Send email notification
        if: steps.smtp_check.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Java E2E CI Pipeline — ${{ github.ref_name }} (${{ github.sha }})"
          to: ${{ secrets.SMTP_TO }}
          from: ${{ secrets.SMTP_FROM }}
          attachments: ci-report/execution-report.html
          body: |
            Java End-to-End CI Pipeline Run Summary
            ========================================

            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Commit SHA : ${{ github.sha }}
            Triggered by: ${{ github.event_name }}

            Job Results
            -----------
            build-test : ${{ needs.build-test.result }}
            docker     : ${{ needs.docker.result }}

            Java Program Counts
            -------------------
            Total main methods in repository : ${{ steps.program_counts.outputs.total_programs }}
            By top-level source folder        : ${{ steps.program_counts.outputs.folder_counts }}

            Docker Image Details
            --------------------
            Image name : ghcr.io/${{ github.repository_owner }}/java-project
            SHA tag    : ghcr.io/${{ github.repository_owner }}/java-project:${{ github.sha }}
            Latest tag : ghcr.io/${{ github.repository_owner }}/java-project:latest
            Pushed     : ${{ needs.docker.outputs.pushed }}

            Note: Images are pushed to GHCR only on push events (not on pull requests).

            View workflow run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
