name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
  schedule:
    - cron: '30 17 * * *'

jobs:
  build-and-run:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        working-directory: demo
        run: mvn -B clean package

      - name: Run all detected classes with main()
        working-directory: demo
        shell: bash
        run: |
          set -euo pipefail
          echo "Running all classes that expose main() in target/classes"

          if [ ! -d target/classes ]; then
            echo "target/classes not found; skipping execution step."
            exit 0
          fi

          found_main=false
          while IFS= read -r -d '' class_file; do
            cls=${class_file#target/classes/}
            cls=${cls%.class}
            cls=${cls//\//.}

            if javap -classpath target/classes "$cls" 2>/dev/null | grep -q "public static void main"; then
              found_main=true
              echo "--- RUNNING: $cls ---"
              timeout 15s java -cp target/classes "$cls" || true
            fi
          done < <(find target/classes -type f -name '*.class' -print0 | sort -z)

          if [ "$found_main" = false ]; then
            echo "No classes with public static void main found."
          fi

      - name: Run tests and generate report
        working-directory: demo
        run: mvn -B test

      - name: Email test report
        if: ${{ always() && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.SMTP_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Java Program Execution Report
          body: |
            The scheduled Java pipeline has completed.
            Please find the test report attached.
          to: chaitanyassm@outlook.com
          from: ${{ secrets.SMTP_FROM }}
          attachments: demo/target/surefire-reports/*.xml
